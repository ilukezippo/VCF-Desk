name: Build Android app

on:
  push:
    branches: ["**"]       # needed: with only tags listed, branch pushes would never build
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]           # path filters are not applied to tag pushes
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (for example v1.0). Leave empty to only build."
        required: false
        type: string

permissions:
  contents: write          # lets a tag build attach the APK to its release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"   # Robolectric needs 21+ for SDK 35/36
      - uses: gradle/actions/setup-gradle@v4
      - name: Read version
        id: ver
        run: |
          v=$(grep -E 'versionName *= *"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "versionName = $v"
      - name: Check for signing secrets
        id: sign
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found: building a signed release APK"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            if [[ "$GITHUB_REF" == refs/tags/* ]] || [ -n "$INPUT_TAG" ]; then
              echo "::warning::Signing secrets not set: built an unsigned debug APK, nothing will be attached to the release"
            else
              echo "::notice::Signing secrets not set: building an unsigned debug APK (artifact only)"
            fi
          fi
      - name: Decode keystore
        if: steps.sign.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed release APK
        if: steps.sign.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
      - name: Test and build unsigned debug APK
        if: steps.sign.outputs.signed != 'true'
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK
        id: apk
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            src=$(ls app/build/outputs/apk/release/*.apk | head -1)
            dst="VCF-Desk-Android-${{ steps.ver.outputs.version }}.apk"
          else
            src=app/build/outputs/apk/debug/app-debug.apk
            dst="VCF-Desk-Android-${{ steps.ver.outputs.version }}-debug.apk"
          fi
          cp "$src" "$dst"
          echo "path=android/$dst" >> "$GITHUB_OUTPUT"
          ls -la "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: VCF-Desk-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            android/**/build/reports/tests
            android/**/build/test-results
          retention-days: 7
      - name: Check the release exists
        id: rel
        # a tag push, or a manual run from main with the "tag" input filled in
        # (older tags such as v1.0 predate this workflow, so they can't be run directly)
        if: (startsWith(github.ref, 'refs/tags/') || inputs.tag != '') && steps.sign.outputs.signed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # never create a release here: the Windows workflow owns it
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $TAG does not exist yet: wait for the Windows build to publish it, then run this workflow again"
          fi
      - name: Attach the APK to the release
        # only adds (or replaces) this one file; other release assets are left alone
        if: steps.rel.outputs.exists == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.rel.outputs.tag }}
          APK: ${{ steps.apk.outputs.path }}
        working-directory: .
        run: gh release upload "$TAG" "$APK" --clobber --repo "$GITHUB_REPOSITORY"

name: Build Android app

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write          # lets a tag build attach the APK to its release

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    env:
      ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Read version
        id: ver
        run: |
          v=$(grep -E 'versionName *= *"' app/build.gradle.kts | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "versionName = $v"
      - name: Check for signing secrets
        id: sign
        run: |
          if [ -n "$ANDROID_KEYSTORE_B64" ] && [ -n "$ANDROID_KEYSTORE_PASSWORD" ] && [ -n "$ANDROID_KEY_ALIAS" ] && [ -n "$ANDROID_KEY_PASSWORD" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "Signing secrets found: building a signed release APK"
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Signing secrets not set: building an unsigned debug APK (artifact only)"
          fi
      - name: Decode keystore
        if: steps.sign.outputs.signed == 'true'
        run: |
          echo "$ANDROID_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Test and build signed release APK
        if: steps.sign.outputs.signed == 'true'
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleRelease
      - name: Test and build unsigned debug APK
        if: steps.sign.outputs.signed != 'true'
        run: ./gradlew --no-daemon :core:test :app:testDebugUnitTest :app:assembleDebug
      - name: Name the APK
        id: apk
        run: |
          if [ "${{ steps.sign.outputs.signed }}" = "true" ]; then
            src=$(ls app/build/outputs/apk/release/*.apk | head -1)
            dst="VCF-Desk-Android-${{ steps.ver.outputs.version }}.apk"
          else
            src=app/build/outputs/apk/debug/app-debug.apk
            dst="VCF-Desk-Android-${{ steps.ver.outputs.version }}-debug.apk"
          fi
          cp "$src" "$dst"
          echo "path=android/$dst" >> "$GITHUB_OUTPUT"
          ls -la "$dst"
      - uses: actions/upload-artifact@v4
        with:
          name: VCF-Desk-Android
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: |
            android/**/build/reports/tests
            android/**/build/test-results
          retention-days: 7
      - name: Attach the APK to the release
        # only a tagged build with real signing is published; an existing release keeps its other files
        if: startsWith(github.ref, 'refs/tags/') && steps.sign.outputs.signed == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}

name: Tests

on:
  push:
    paths-ignore: ["*.md", "shots/**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest ruff
      - name: Code check
        run: ruff check --select F821,F822,F823,F811,F632,F701,F702,F704,F706,E9 --output-format github VCF_Desk.pyw vcf_core.py tests
      - name: Tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q tests
